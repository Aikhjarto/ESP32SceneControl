; ESP32PWM — servo scene controller
;
; Build:      pio run
; Flash:      pio run -t upload
; Monitor:    pio device monitor
; Unit tests: pio test -e native
; OTA:        python3 tools/serve_firmware.py  (serves the signed build on port 9999)
;
; Note: PlatformIO generates sdkconfig.<env> from sdkconfig.defaults only once.
; After changing sdkconfig.defaults, delete sdkconfig.<env> to regenerate it.

[platformio]
default_envs = esp32dev

[esp32_common]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
extra_scripts =
    pre:scripts/embed_web.py
    pre:scripts/ota_sign.py
board_build.embed_files =
    web/dist/index.html.gz
    web/dist/app.js.gz
    web/dist/style.css.gz
    keys/ota_verify_key.bin
; Private key for signing OTA images; keep it out of the repository and back it up.
; Override with the ESP32PWM_OTA_KEY environment variable.
custom_ota_signing_key = ~/.config/esp32pwm/ota_signing_key.pem

[env:esp32dev]
extends = esp32_common
board = esp32dev
board_upload.flash_size = 4MB

; Host-side unit tests for the portable core (motion math, scene engine, settings, parser).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags = -std=gnu++17 -Isrc -Wall -Wextra
